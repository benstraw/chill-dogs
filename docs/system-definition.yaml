# chill-dogs System Definition
# Source of truth for site intent, page types, modules, and conversion architecture.
#
# Maintenance rule (mandatory):
# - Update this file whenever pages, routes, page types, module stacks,
#   navigation, or conversion flow changes.
# - Any AI-assisted page additions/changes must keep this file current.

site_system:
  status: "active"
  as_of: "2026-06-03"
  owner: "chill-dogs"
  purpose: "Define the website as a modular conversion system and keep implementation aligned."

  maintenance_policy:
    required_on_change:
      - "new page added"
      - "page removed"
      - "page type changed"
      - "route changed"
      - "navigation changed"
      - "module stack changed"
      - "analytics funnel changed"
    enforced_by:
      - "AGENTS.md"
      - "CLAUDE.md"

  related_content:
    status: "active_for_migrated_internal_link_strip_and_related_guides"
    source_of_truth: "complete build-time sitemap inventory"
    helper: "src/utils/related-pages.ts"
    metadata_fields:
      - "topics"
      - "pinnedRelated"
      - "excludeRelated"
      - "relatedLabel"
    notes: >
      Related-link derivation is active for migrated InternalLinkStrip and RelatedGuides
      instances via currentHref. New related relationships should be encoded as sitemap
      metadata rather than manual rendered arrays. Manual related arrays are deprecated
      now that related-content migration has started; preserve editorial intent with
      pinnedRelated and excludeRelated instead.

  keystone_metrics:
    primary: "Amazon affiliate revenue (qualified outbound clicks to purchases)"
    secondary: "collector_to_converter_click rate"

  page_inventory:
    - name: "Home"
      type: "attractor"
      target_action: "Route visitors into cooling, calming, comforting, crate-training, and road-trip crate paths"
      metric: "hero_click_cooling + hero_click_calming CTR + comfort block clicks"
      notes: >
        Home page includes a dusty rose color block introducing the Comfort & Rest collector
        with tagline "Settle in." — positioned between HomepageHero and the start-prompt section.
        The From the Guide section features all current article collectors with OG-image cards,
        including How to Crate Train Your Dog to connect informational crate intent with the
        new crate converter path.
        The Browse Picks list is temporarily broad enough to include Best Lick Mats for Dogs
        and Best Travel Crates for Road Trips until converter routing below the article section
        gets a fuller refactor.
        A homepage-inline email signup block sits below HomepageBody as a secondary capture path.

    - name: "Cooling"
      type: "collector"
      collector_subtype: "section"
      target_action: "Route heat-intent traffic to cooling converters"
      metric: "collector_to_converter_click to cooling converters"
      notes: "Section collector uses SectionCollectorPage with dynamic topic-matched converter and article cards from the complete sitemap inventory, grouped into topic subsections for car cooling, mats, wearables, frozen enrichment, heat safety, and related cooling paths."

    - name: "Calming"
      type: "collector"
      collector_subtype: "section"
      target_action: "Route anxiety-intent traffic to calming converters"
      metric: "collector_to_converter_click to calming converters"
      notes: "Section collector uses SectionCollectorPage with dynamic topic-matched converter and article cards from the complete sitemap inventory, grouped into topic subsections for car anxiety, fireworks/noise including prep and checklist searches, crate comfort, escape-risk tracking, research/safety, and calming comparisons including lick-mat enrichment."

    - name: "Comfort"
      type: "collector"
      collector_subtype: "section"
      target_action: "Route rest, crate, carrier, and travel-comfort intent to comfort converters"
      metric: "collector_to_converter_click to comfort converters"
      notes: "Section collector uses SectionCollectorPage with dynamic topic-matched converter and article cards from the complete sitemap inventory, grouped into topic subsections for beds, crates, flying/carriers/travel prep, and related comfort paths."

    - name: "Cooling converters"
      type: "converter"
      target_action: "Drive affiliate outbound clicks"
      metric: "amazon_outbound_click rate"
      routes:
        - "/cooling/best-cooling-products-for-dogs/"
        - "/cooling/cooling-mats/"
        - "/cooling/cooling-bandanas/"
        - "/cooling/cooling-vests/"
        - "/cooling/freezable-dog-toys/"
        - "/cooling/car-cooling-for-dogs/"
        - "/cooling/dog-travel-hydration/"

    - name: "Calming converters"
      type: "converter"
      target_action: "Drive affiliate outbound clicks"
      metric: "amazon_outbound_click rate"
      routes:
        - "/calming/best-calming-products-for-anxious-dogs/"
        - "/calming/best-thundershirt-alternatives/"
        - "/calming/car-anxiety-for-dogs/"
        - "/calming/best-lick-mats-for-dogs/"

    - name: "Keep a Dog Cool in a Car"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route car-heat-intent traffic to cooling converters"
      metric: "collector_to_converter_click to car cooling and related converters + pinterest_save_click"
      routes:
        - "/cooling/keep-dog-cool-in-car/"
      notes: "Opt-in PinterestSave modules expose approved article pins near the back-seat heat summary and road-trip checklist section, supporting social recirculation without changing the collector page type."

    - name: "How Hot Is Too Hot for Dogs"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route heat-safety-intent traffic to cooling converters"
      metric: "collector_to_converter_click to cooling converters"
      routes:
        - "/cooling/how-hot-is-too-hot-for-dogs/"

    - name: "How Much Do Dogs Sleep"
      type: "collector"
      collector_subtype: "article"
      pillar: "comfort"
      target_action: "Route sleep-intent traffic to calming and orthopedic bed converters"
      metric: "collector_to_converter_click to comfort converters"
      routes:
        - "/comforting/how-much-do-dogs-sleep/"

    - name: "Relaxation converters"
      type: "converter"
      pillar: "comfort"
      pillar_tagline: "Rest. Recovery. Relaxation."
      target_action: "Drive affiliate outbound clicks on dog beds and dog crates"
      metric: "amazon_outbound_click rate"
      routes:
        - "/comforting/best-calming-dog-beds/"
        - "/comforting/best-orthopedic-dog-beds/"
        - "/comforting/best-puppy-crates/"
        - "/comforting/best-anxiety-dog-crates/"
        - "/comforting/best-travel-crates-for-road-trips/"
        - "/comforting/best-airline-crates-for-flying-with-your-dog/"
        - "/comforting/best-airline-approved-dog-carriers/"
        - "/comforting/best-dog-travel-bags-for-flying/"
        - "/comforting/best-furniture-dog-crates/"
        - "/comforting/best-heavy-duty-dog-crates/"
      notes: >
        Comfort collector routes to calming beds, orthopedic beds, puppy crates, anxiety crates, travel crates,
        airline crates, airline carriers, furniture crates, and heavy-duty crates.
        The soft-sided airline carrier converter now groups picks into classic, expandable, compact,
        and tote-style sections so the page can expand without turning into a single undifferentiated product wall.
        The furniture crates page includes double-compartment and multi-door picks alongside standard furniture options.
        The heavy-duty crates page includes reinforced furniture-style options alongside utility wire crates.
        The crate-training collector article now routes into the airline, furniture, and heavy-duty crate paths as well.
        Placeholder product entries (ASINs B0D5B56X9V, B0DTH4195V) need
        to be identified and updated in src/data/relaxation-products.ts.

    - name: "Crate Training for Dogs"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route crate-training-intent traffic to calming and comfort converters"
      metric: "collector_to_converter_click to calming and comfort converters"
      routes:
        - "/calming/crate-training-for-dogs/"

    - name: "CBD for Dogs"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route CBD/calming-research intent to calming converters and orthopedic bed converter"
      metric: "collector_to_converter_click to calming and comfort converters + pinterest_save_click"
      routes:
        - "/calming/cbd-for-dogs/"
      notes: >
        Informational safety article; does not recommend CBD or include Amazon CBD product links.
        Sources include Cornell Riney Canine Health Center, FDA, Frontiers in Veterinary Science,
        Colorado State University, AKC CHF, PetMD, and California DCC. Internal links route to
        calming converters and orthopedic beds. No dosage instructions. Medical escalation language
        included for severe reactions. Opt-in PinterestSave modules expose approved article pins
        near the intro decision framing and vet checklist sections.

    - name: "How to Prepare a Calm Room for Fireworks Night"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route fireworks-anxiety search traffic to calming converters"
      metric: "collector_to_converter_click to calming converters"
      routes:
        - "/calming/how-to-prepare-a-calm-room-for-fireworks-night/"
      notes: "Practical fireworks-night setup guide focused on one low-stimulation room, then routing readers to calming product and wrap comparisons."

    - name: "Dog Fireworks Anxiety Checklist"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route fireworks-anxiety checklist traffic to companion fireworks articles and calming converters"
      metric: "collector_to_converter_click to fireworks companion articles and calming converters"
      routes:
        - "/calming/dog-fireworks-anxiety-checklist/"
      notes: "Practical July 4 checklist organized around the week before, the day of, and the morning after, with section links and related-strip paths to the fireworks calm-room and event-decision articles plus conversion paths into calming products, wrap alternatives, and car-anxiety support."

    - name: "Should You Take Your Dog to Fireworks?"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route fireworks-event and safety intent to calming, cooling, and GPS converter pages"
      metric: "collector_to_converter_click to calming, cooling, and GPS converters + newsletter_cta_click"
      routes:
        - "/calming/should-you-take-your-dog-to-fireworks/"
      notes: "Practical outdoor-event decision guide focused on leaving before dark, safe exit planning, newsletter capture after the exit-before-dark rule, and recovery paths through calming, cooling, car-anxiety, and GPS tracker converters."

    - name: "Road Trip Chill Kit"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route mixed intent to cooling and calming converters"
      metric: "collector_to_converter_click split by destination"
      routes:
        - "/travel/dog-road-trip-gear/"

    - name: "How to Fly With a Dog"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route air-travel intent to calming converters and comfort bed converters"
      metric: "collector_to_converter_click to calming and comfort converters"
      routes:
        - "/travel/how-to-fly-with-a-dog/"
      notes: "Informational air-travel guide; attributes facts to TSA, USDA APHIS, AVMA, DOT, CDC, and AAHA. No product roundup. Internal links to calming and comfort converters."

    - name: "Best Dog-Friendly Airlines"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route dog-friendly flight service intent to travel, calming, and comfort converters/collectors"
      metric: "collector_to_converter_click to travel, calming, and comfort pages"
      routes:
        - "/travel/dog-friendly-airlines/"
      notes: "Article collector focused on dog-forward onboard flight options beyond standard under-seat commercial airline pet policies; routes to flying-with-dogs, carrier, travel bag, car anxiety, and road trip pages."

    - name: "How Much Do Dogs Sleep"
      type: "collector"
      collector_subtype: "article"
      target_action: "Route dog sleep intent to comfort converters (calming beds, orthopedic beds)"
      metric: "collector_to_converter_click to comfort converters"
      routes:
        - "/comforting/how-much-do-dogs-sleep/"

    - name: "Rhys Ran Away (Cerro San Luis Obispo)"
      type: "collector"
      target_action: "Route story-driven search traffic to GPS tracker comparison converter"
      metric: "collector_to_converter_click to /gear/best-dog-gps-trackers/"
      routes:
        - "/travel/rhys-ran-away-cerro-san-luis-obispo/"
      notes: "Story-driven narrative collector; introduces tracker type education; primary CTA to trackingTop"

    - name: "GPS Tracker comparison"
      type: "converter"
      target_action: "Drive affiliate outbound clicks for GPS tracker products"
      metric: "amazon_outbound_click rate (placeholder CTAs pending affiliate setup)"
      routes:
        - "/gear/best-dog-gps-trackers/"

    - name: "Fi Dog Collar Review"
      type: "converter"
      target_action: "Drive affiliate outbound clicks for Fi collar; route off-grid seekers to Garmin page"
      metric: "amazon_outbound_click rate (placeholder CTAs pending affiliate setup)"
      routes:
        - "/gear/fi-dog-collar-review/"

    - name: "Garmin Dog Tracking Collars"
      type: "collector"
      target_action: "Route off-grid tracking intent to GPS tracker comparison"
      metric: "collector_to_converter_click to /gear/best-dog-gps-trackers/"
      routes:
        - "/gear/garmin-dog-tracking-collars/"

    - name: "AirTag for Dogs"
      type: "collector"
      target_action: "Route AirTag searchers to GPS tracker comparison with accurate expectation-setting"
      metric: "collector_to_converter_click to /gear/best-dog-gps-trackers/"
      routes:
        - "/gear/airtag-for-dogs/"

    - name: "What to Do If Your Dog Runs Away"
      type: "collector"
      target_action: "Route safety-intent traffic to GPS tracker comparison and Rhys story"
      metric: "collector_to_converter_click to /gear/best-dog-gps-trackers/ and /travel/rhys-ran-away-cerro-san-luis-obispo/"
      routes:
        - "/safety/what-to-do-if-your-dog-runs-away/"

    - name: "Product browse"
      type: "converter"
      pillar: "all"
      target_action: "Drive affiliate outbound clicks from cross-pillar product discovery"
      metric: "amazon_outbound_click rate"
      routes:
        - "/shop/"
      notes: >
        Public-facing product catalog at /shop/. Shows all products from src/data/product-catalog.ts
        with client-side filtering by pillar, category, and search. Linked from site footer.
        Page type is converter (not informer) because it drives Amazon affiliate clicks.

    - name: "Search"
      type: "collector"
      target_action: "Surface pages and products by keyword; route users to converters"
      metric: "search_query, search_result_click, downstream amazon_outbound_click on converter pages"
      routes:
        - "/search/"
      notes: >
        Client-side Fuse.js search at /search/. Index prerendered at build time via src/pages/search-index.json.ts,
        which merges all non-noindex sitemap pages with the full product catalog. Filter bar (All/Guides/Collectors/Products).
        Page result cards route to indexed site pages. Product result cards route internally to /shop/?q=... so
        search results do not expose direct Amazon links. Page is noindex. See docs/ai/engineering/search.md.

    - name: "Informer pages"
      type: "informer"
      target_action: "Trust and compliance clarity"
      metric: "No conversion obstruction"
      routes:
        - "/admin/products/"
        - "/content-sitemap/"
        - "/about/"
        - "/contact/"
        - "/privacy-policy/"
        - "/terms/"
        - "/affiliate-disclosure/"
        - "/subscribe/"
        - "/subscribe/thanks/"
        - "/subscribe/confirmed/"
        - "/shelter-dog-charities/"
      notes: "/admin/products/ is the canonical product inventory review page. Every product in any product data file must flow into this page through src/data/product-catalog.ts; do not hardcode product rows in the admin route. /content-sitemap/ is a hidden editor page that previews the complete build-time sitemap inventory from src/data/sitemap-inventory.ts, which merges static pages with article collection pages and final built share metadata, including post-build OG image rewrites."

  modules:
    workhorse:
      - "BaseLayout"
      - "Hero"
      - "HeroExperiment"
      - "CoolingConverterPage"
      - "CalmingConverterPage"
      - "RelaxationConverterPage"
      - "SectionCollectorPage"
      - "CollectorBody"
      - "ComparisonTable"
      - "CoolingProductGrid"
      - "CoolingProductCard"
      - "CalmingProductCard"
      - "RelaxationProductCard"
      - "FAQ"
      - "Disclosure"
      - "InternalLinkStrip"
      - "PinterestSave"
      - "Toc"
      - "RelatedGuides"
    showstopper:
      - "CoolingHubHeroDesert"
      - "CalmingHubHeroFireworks"
      - "404 visual page"
    high_touch:
      - "HomepageHero variants"
      - "collector variant routes (/v/, /cooling/v/, /calming/v/)"
      - "Road Trip collector narrative"

  nav:
    primary_links:
      - "/"
      - "/cooling/"
      - "/calming/"
      - "/comforting/"
      - "/about/"
    pillar_theme_contract:
      source: "src/data/pillar-themes.ts"
      rule: "Every page whose URL path starts with /cooling/, /calming/, or /comforting/ inherits its pillar theme in BaseLayout."
      active_state: "Top-nav active and hover colors use the resolved pillar accent via --color-nav-accent."
      themes:
        cooling: "cooling blue for links, buttons, hover states, and soft accents on /cooling/*"
        calming: "calming green for links, buttons, hover states, and soft accents on /calming/*"
        comfort: "dusty rose for links, buttons, hover states, and soft accents on /comforting/*; do not use sky blue or terracotta as the Comforting authority"

  footer:
    sections:
      - "Explore: cooling, calming, comforting, dog charities we love"
      - "Company: about, contact"
      - "Legal: privacy-policy, terms, affiliate-disclosure"
      - "Newsletter signup on non-converter pages only"
    final_cta: "Persistent affiliate disclosure, trust reinforcement, and secondary email capture on non-converter pages"

  conversion_flow:
    steps:
      - "Entry on attractor or collector"
      - "Above-the-fold route to converter"
      - "Comparison and product rationale"
      - "Affiliate outbound click"
      - "Amazon purchase completion"
    friction_points:
      - "Route or tracking metadata mismatches"
      - "Duplicated page scaffolding that drifts over time"
      - "Static collector card lists that drift from the sitemap inventory"
      - "Collector pages without clear converter paths"

  email_capture_flow:
    scope: "Homepage inline signup + footer signup on non-converter pages"
    provider: "Buttondown"
    events:
      - "newsletter_cta_click"
      - "email_signup_view"
      - "email_signup_start"
      - "email_signup_submit"
      - "pageview:/subscribe/"
      - "pageview:/subscribe/thanks/"
      - "pageview:/subscribe/confirmed/"
    notes: >
      Converters intentionally exclude the footer signup so affiliate pages stay single-purpose.
      /subscribe/ is a dedicated signup landing page (noindex, not linked from the site) for sharing directly.
      /subscribe/thanks/ and /subscribe/confirmed/ are informer pages, noindex, excluded from sitemap discovery,
      and include a minimal Chill-Dogs logo link back to the homepage without restoring full site chrome.

  product_data:
    product_catalog: "src/data/product-catalog.ts — normalized admin inventory across every product data source with merchant offers[]; /admin/products/ must consume this data module and remain complete whenever products are added"
    product_offer_helpers: "src/data/products/ — merchant metadata, offer types, and helpers for Amazon/Chewy affiliate offers; canonical editorial product copy stays in product records, not merchant offers"
    cooling_products: "src/data/cooling-products.ts — 25 products with canonical editorial copy, optional Amazon ASIN/affiliate URL, optional merchant offers, and image thumbnails"
    calming_products: "src/data/calming-products.ts — 23 products with canonical editorial copy, optional Amazon ASIN/affiliate URL, optional merchant offers, and image thumbnails"
    relaxation_products: "src/data/relaxation-products.ts — 78 products (calming beds, orthopedic beds, crates, carriers, travel beds, travel bags) with canonical editorial copy, optional Amazon ASIN/affiliate URL, optional merchant offers, and image thumbnails"
    tracking_products: "src/data/tracking-products.ts — 8 tracker products and 1 accessory product across cellular/off-grid/bluetooth/accessory types"
    raw_api_cache: "src/data/amazon-products/*.json — full SerpAPI/SearchAPI Amazon Product responses per ASIN; _index.json sidecar tracks fetchedAt/provider/title/image freshness diagnostics only and must not overwrite canonical product copy or images"
    future_chewy_cache: "src/data/chewy-products/*.json — reserved future diagnostic cache for Chewy provider metadata by merchant product id or stable URL-derived key; mirror Amazon cache behavior without auto-overwriting editorial fields"

  architecture:
    frontend: "Astro 5 static site with scoped CSS and reusable modules"
    cms: "None (code-first content/config in repository)"
    hosting: "Static build deployment"
    seo_strategy: "collector captures intent; converter monetizes intent; variant routes remain canonicalized and noindex"
    sitemap_inventory: "src/data/sitemap-inventory.ts composes staticSitemapSections with article MDX collection entries at build time; future related-content derivation should use the complete inventory instead of static-only sections."
    section_collectors: "src/data/section-collectors.ts defines cooling, calming, and comfort collector metadata, topic subsection grouping, topic coverage, priority ordering, dynamic CollectorBody card inventories, and CollectionPage hasPart schema from the complete sitemap inventory."

  redirects:
    # Production: vercel.json → redirects array (true HTTP redirect at Vercel edge).
    # Local dev/preview: astro.config.mjs → redirects block (meta-refresh fallback).
    # Add an entry here any time a live/indexed URL changes or a marketing alias is added.
    - from: "/join"
      to: "https://www.chill-dogs.com/subscribe/?utm_source=postcard&utm_medium=print&utm_campaign=offline_flyer"
      status: 302
      reason: "Short marketing alias for postcard QR codes; temporary redirect keeps the campaign destination editable."
      date: "2026-06-02"
    - from: "/travel/rhys-road-trip-chill-kit/"
      to: "/travel/dog-road-trip-gear/"
      status: 301
      reason: "Slug updated to target primary keyword 'dog road trip gear'; old URL was indexed."
      date: "2026-03-20"

  analytics:
    primary_events:
      - "affiliate_outbound_click"
      - "amazon_outbound_click"
      - "collector_to_converter_click"
      - "hero_click_cooling"
      - "hero_click_calming"
      - "hero_cta_click"
      - "hero_impression"
      - "toc_click"
      - "pinterest_save_click"
    funnel_definition: "collector or attractor entry -> converter click -> affiliate_outbound_click; Amazon links dual-fire amazon_outbound_click during dashboard migration"
