name: Integration checks

# The merchant-data checks need outbound access to amazon.com and
# api.impact.com. GitHub runners have unrestricted egress, so this is the
# reliable place to run them on a schedule — sandboxed agent containers only
# reach hosts on their environment's network allowlist.

on:
  schedule:
    # Mondays at 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        default: all
        options: [all, asins, amazon-cache, chewy]

permissions:
  contents: read

jobs:
  checks:
    name: Merchant data checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check ASIN validity
        id: asins
        if: ${{ github.event.inputs.check == '' || github.event.inputs.check == 'all' || github.event.inputs.check == 'asins' }}
        run: bun run check:asins 2>&1 | tee asin-report.txt

      - name: Check Amazon cache freshness
        if: ${{ github.event.inputs.check == '' || github.event.inputs.check == 'all' || github.event.inputs.check == 'amazon-cache' }}
        run: bun run check:amazon -- --fail-on-stale 2>&1 | tee amazon-cache-report.txt

      - name: Verify Chewy Impact credentials
        if: ${{ github.event.inputs.check == '' || github.event.inputs.check == 'all' || github.event.inputs.check == 'chewy' }}
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          CHEWY_IMPACT_CAMPAIGN_ID: ${{ secrets.CHEWY_IMPACT_CAMPAIGN_ID }}
          CHEWY_IMPACT_AD_ID: ${{ secrets.CHEWY_IMPACT_AD_ID }}
        run: |
          if [ -z "$IMPACT_ACCOUNT_SID" ]; then
            echo "IMPACT_ACCOUNT_SID not configured — skipping Chewy check."
            exit 0
          fi
          bun run chewy-link:verify

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-check-reports
          path: '*-report.txt'
          if-no-files-found: ignore
