name: Weekly product maintenance

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Offline rollout, Chewy smoke test, or bounded weekly checks
        type: choice
        default: offline
        options: [offline, chewy-smoke, live]

# Smoke tests, schedules, and reruns share this group. A canceled run retains
# its durable reservation and cannot obtain another weekly allowance.
concurrency:
  group: product-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  maintenance:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INDEXNOW_DRY_RUN: 'true'
      PUBLIC_SITE_URL: https://www.chill-dogs.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build site for actual placements
        id: build
        continue-on-error: true
        run: bun run build 2>&1 | tee maintenance-build.log
      - name: Collect offline report
        id: offline
        if: always()
        continue-on-error: true
        run: bun run maintenance:offline 2>&1 | tee maintenance-offline.log
      - name: Run bounded checks and publish
        id: maintenance
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAINTENANCE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_MODE: ${{ inputs.mode }}
          LIVE_ENABLED: ${{ vars.MAINTENANCE_LIVE_ENABLED }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY || secrets.SERPAPI_KEY }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          IMPACT_ACCOUNT_SID: ${{ vars.IMPACT_ACCOUNT_SID || secrets.IMPACT_ACCOUNT_SID }}
          CHEWY_IMPACT_CAMPAIGN_ID: ${{ vars.CHEWY_IMPACT_CAMPAIGN_ID || secrets.CHEWY_IMPACT_CAMPAIGN_ID }}
          CHEWY_IMPACT_AD_ID: ${{ vars.CHEWY_IMPACT_AD_ID || secrets.CHEWY_IMPACT_AD_ID }}
          CHEWY_IMPACT_CATALOG_ID: ${{ vars.CHEWY_IMPACT_CATALOG_ID || secrets.CHEWY_IMPACT_CATALOG_ID }}
        run: |
          mode="${REQUESTED_MODE:-offline}"
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$LIVE_ENABLED" == true ]]; then mode=live; fi
          if [[ "$mode" == live && "$LIVE_ENABLED" != true ]]; then
            echo 'Live rollout is disabled; publishing offline findings.'
            mode=offline
          fi
          bun run scripts/product-maintenance.ts "--$mode" --publish 2>&1 | tee maintenance-live.log
      - name: Upload complete reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-maintenance
          path: |
            .cache/maintenance/
            maintenance-*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Summarize report
        if: always()
        run: |
          bun -e '
            const fs = require("node:fs");
            const file = ".cache/maintenance/report.json";
            if (!fs.existsSync(file)) process.exit(1);
            const r = JSON.parse(fs.readFileSync(file, "utf8"));
            const rows = Object.entries(r.coverage).map(([name,c]) => `| ${name} | ${c.status} | ${c.checked} | ${c.skipped} | ${c.unknown} | ${c.failed} | ${c.budgetLimited} | ${c.unconfigured} |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [`Report: ${r.generatedAt}`, "", "| Integration | Status | Checked | Skipped | Unknown | Failed | Budget limited | Unconfigured |", "|---|---|---:|---:|---:|---:|---:|---:|", ...rows, "", ...r.errors].join("\n") + "\n");
          '
      - name: Final status independently of publication
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          OFFLINE_RESULT: ${{ steps.offline.outcome }}
          MAINTENANCE_RESULT: ${{ steps.maintenance.outcome }}
        run: |
          [[ "$BUILD_RESULT" == success && "$OFFLINE_RESULT" == success && "$MAINTENANCE_RESULT" == success ]]
          bun run scripts/product-maintenance.ts --gate
