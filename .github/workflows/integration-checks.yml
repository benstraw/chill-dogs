name: Integration checks

# The merchant-data checks need outbound access to amazon.com and
# api.impact.com. GitHub runners have unrestricted egress, so this is the
# reliable place to run them on a schedule — sandboxed agent containers only
# reach hosts on their environment's network allowlist, and Bun's fetch cannot
# use the agent proxy at all (docs/ai/engineering/environment-and-integrations.md).

on:
  schedule:
    # Mondays at 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        default: all
        options: [all, asins, amazon-cache, chewy]

permissions:
  contents: read
  issues: write

jobs:
  checks:
    name: Merchant data checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each check runs with continue-on-error so one failure cannot suppress
      # the others — a dead ASIN used to mean that week's cache-freshness and
      # Chewy results were never collected. The gate step at the end fails the
      # job on any of their outcomes.
      - name: Check ASIN validity
        id: asins
        if: ${{ inputs.check == '' || inputs.check == 'all' || inputs.check == 'asins' }}
        continue-on-error: true
        run: bun run check:asins 2>&1 | tee asin-report.txt

      - name: Check Amazon cache freshness
        id: amazon_cache
        if: ${{ inputs.check == '' || inputs.check == 'all' || inputs.check == 'amazon-cache' }}
        continue-on-error: true
        run: bun run check:amazon -- --fail-on-stale 2>&1 | tee amazon-cache-report.txt

      - name: Verify Chewy Impact credentials
        id: chewy
        if: ${{ inputs.check == '' || inputs.check == 'all' || inputs.check == 'chewy' }}
        continue-on-error: true
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          CHEWY_IMPACT_CAMPAIGN_ID: ${{ secrets.CHEWY_IMPACT_CAMPAIGN_ID }}
          CHEWY_IMPACT_AD_ID: ${{ secrets.CHEWY_IMPACT_AD_ID }}
        run: |
          if [ -z "$IMPACT_ACCOUNT_SID" ]; then
            echo "IMPACT_ACCOUNT_SID not configured — skipping Chewy check."
            exit 0
          fi
          bun run chewy-link:verify 2>&1 | tee chewy-report.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-check-reports
          path: '*-report.txt'
          if-no-files-found: ignore
          retention-days: 90

      - name: Summarize
        if: always()
        env:
          ASINS: ${{ steps.asins.outcome }}
          AMAZON_CACHE: ${{ steps.amazon_cache.outcome }}
          CHEWY: ${{ steps.chewy.outcome }}
        run: |
          {
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| ASIN validity | ${ASINS:-skipped} |"
            echo "| Amazon cache freshness | ${AMAZON_CACHE:-skipped} |"
            echo "| Chewy credentials | ${CHEWY:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # One tracking issue, reopened and commented on rather than refiled, so a
      # long-lived dead link does not mint a new issue every Monday.
      - name: File or update tracking issue
        if: ${{ always() && (steps.asins.outcome == 'failure' || steps.amazon_cache.outcome == 'failure' || steps.chewy.outcome == 'failure') }}
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'merchant-check';
            const outcomes = {
              'ASIN validity': process.env.ASINS,
              'Amazon cache freshness': process.env.AMAZON_CACHE,
              'Chewy credentials': process.env.CHEWY,
            };
            const failed = Object.entries(outcomes)
              .filter(([, o]) => o === 'failure')
              .map(([name]) => name);

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const body = [
              `Merchant checks failed on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              ...Object.entries(outcomes).map(([name, o]) => `- **${name}**: ${o || 'skipped'}`),
              '',
              `Run log and \`*-report.txt\` artifacts: ${runUrl}`,
              '',
              'The ASIN check separates dead links from inconclusive results, so a',
              'failure there means products are genuinely gone — unless the log says',
              'the run was throttled, which fails the check for being unable to see',
              'Amazon rather than for finding dead products.',
            ].join('\n');

            await github.rest.issues.createLabel({
              ...context.repo, name: LABEL, color: 'B60205',
              description: 'Automated merchant data checks',
            }).catch(() => {});

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 1,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
              core.notice(`Commented on existing issue #${open[0].number}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              ...context.repo,
              title: `Merchant checks failing: ${failed.join(', ')}`,
              body,
              labels: [LABEL],
              assignees: ['benstraw'],
            });
            core.notice(`Filed issue #${issue.number}`);
        env:
          ASINS: ${{ steps.asins.outcome }}
          AMAZON_CACHE: ${{ steps.amazon_cache.outcome }}
          CHEWY: ${{ steps.chewy.outcome }}

      - name: Fail if any check failed
        if: ${{ always() && (steps.asins.outcome == 'failure' || steps.amazon_cache.outcome == 'failure' || steps.chewy.outcome == 'failure') }}
        run: |
          echo "One or more merchant checks failed — see the job summary above."
          exit 1
