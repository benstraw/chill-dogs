name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Canonical/OG URLs are baked in at build time.
      PUBLIC_SITE_URL: https://www.chill-dogs.com
      # `bun run build` ends with the IndexNow submit step; it self-skips unless
      # VERCEL_ENV is production, and the dry run keeps that explicit in CI.
      INDEXNOW_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        # The suite reads dist/, which the build step above produced.
        run: bunx vitest run

      - name: Validate AI knowledge graph
        run: bun run check:ai-docs

      - name: Type check
        run: bunx astro check

      - name: Report Amazon cache freshness
        # Local-cache only, no network. Informational: a stale cache should not
        # block a PR, so this never fails the job.
        run: bun run check:amazon || true
