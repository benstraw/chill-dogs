name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Canonical/OG URLs are baked in at build time.
      PUBLIC_SITE_URL: https://www.chill-dogs.com
      # `bun run build` ends with the IndexNow submit step; it self-skips unless
      # VERCEL_ENV is production, and the dry run keeps that explicit in CI.
      INDEXNOW_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        # Both tiers. The dist tier reads dist/, which the build step above produced,
        # and refuses to run if it is missing or stale.
        run: bunx vitest run --reporter=default --reporter=json --outputFile.json=vitest-report.json

      - name: Report test timings
        # Report-only, never blocking: shared-runner timing noise would make a hard
        # gate flaky. The gate is `bun run test:timing -- --compare` in each PR.
        if: always()
        run: |
          [ -f vitest-report.json ] || exit 0
          node -e '
            const r = require("./vitest-report.json");
            const rows = r.testResults
              .map((t) => [t.name.replace(process.cwd() + "/", ""), Math.round(t.endTime - t.startTime)])
              .sort((a, b) => b[1] - a[1]);
            const out = ["### Test timings", "", `${r.numTotalTests} tests in ${rows.length} files`, "", "| File | Test time |", "|---|---|"];
            for (const [f, ms] of rows.slice(0, 15)) out.push(`| ${f} | ${ms} ms |`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          ' || true

      - name: Validate docs
        run: bun run check:docs

      - name: Type check
        run: bunx astro check

      - name: Report Amazon cache freshness
        # Local-cache only, no network. Informational: a stale cache should not
        # block a PR, so this never fails the job.
        run: bun run check:amazon || true

      - name: Audit product maintenance offline
        run: bun run maintenance:offline

      - name: Publish offline product inventory for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-product-inventory
          path: .cache/maintenance/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
